const $=s=>document.querySelector(s);let current=Number(localStorage.getItem('shiva-book-page')||0);if(current<0||current>chapters.length)current=0;let toastTimer;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('on'),1900)}
function copy(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('Скопировано')).catch(()=>fallback(text))}else fallback(text)}
function fallback(text){const e=document.createElement('textarea');e.value=text;e.style.position='fixed';e.style.top='-1000px';document.body.appendChild(e);e.select();try{document.execCommand('copy');toast('Скопировано')}catch(_){toast('Скопируй вручную')}e.remove()}
function fullText(c){return`ГЛАВА ${String(c.n).padStart(2,'0')}/14 · ${c.title.toUpperCase()}\n\n${c.text}\n\n${c.cliff}\n\n#SHIVA #ПепелИПёс`}
function threadText(c){return c.x.join('\n\n———\n\n')}
function render(){const page=$('#page');page.style.animation='none';void page.offsetWidth;page.style.animation='';if(current===0){page.innerHTML=`<div class="cover"><div><div class="mark">Ψ</div><div class="chapter-meta" style="justify-content:center">Мини-книга · 14 глав</div><h1>ПЕПЕЛ<em>И ПЁС</em></h1><p>История о Шиве, Шибе и человеке, который учится не отдавать рынку право решать за него.</p><button class="btn start" id="start">Открыть главу 01</button></div></div>`;$('#start').onclick=()=>setPage(1)}else{const c=chapters[current-1];page.innerHTML=`<div class="chapter-meta"><span>Глава ${String(c.n).padStart(2,'0')} / 14</span><span class="symbol">${c.symbol}</span></div><h1 class="title">${c.title}</h1><div class="subtitle">${c.sub}</div><div class="story">${c.text.split('\n\n').map(p=>`<p>${p}</p>`).join('')}</div><div class="cliff">${c.cliff}</div><div class="tools"><button class="btn" id="copy-tg">Копировать для Telegram</button><button class="btn ghost" id="show-x">X-тред · 3 поста</button></div>`;$('#copy-tg').onclick=()=>copy(fullText(c));$('#show-x').onclick=()=>showX(c)}
$('#prev').disabled=current===0;$('#next').disabled=current===chapters.length;$('#counter').textContent=String(current).padStart(2,'0')+' / 14';$('#bar').style.width=(current/chapters.length*100)+'%';$$('.toc-item').forEach((e,i)=>e.classList.toggle('on',i===current));localStorage.setItem('shiva-book-page',current)}
function setPage(n){current=Math.max(0,Math.min(chapters.length,n));render();window.scrollTo({top:0,behavior:'smooth'})}
function showX(c){$('#tweets').innerHTML=c.x.map((t,i)=>`<div class="tweet">${t}<small>${t.length} / 280 · пост ${i+1}</small></div>`).join('');$('#x-copy').onclick=()=>copy(threadText(c));$('#x-first').href='https://x.com/intent/tweet?text='+encodeURIComponent(c.x[0]);$('#xpanel').classList.add('on')}
function buildToc(){const box=$('#toc-list');const all=[{title:'Обложка'},...chapters];all.forEach((c,i)=>{const b=document.createElement('button');b.className='toc-item';b.innerHTML=`<b>${String(i).padStart(2,'0')}</b><span>${c.title}</span>`;b.onclick=()=>{setPage(i);$('#drawer').classList.remove('on')};box.appendChild(b)})}
const $$=s=>[...document.querySelectorAll(s)];$('#prev').onclick=()=>setPage(current-1);$('#next').onclick=()=>setPage(current+1);$('#toc-open').onclick=()=>$('#drawer').classList.add('on');$('#toc-close').onclick=()=>$('#drawer').classList.remove('on');$('#drawer').onclick=e=>{if(e.target===$('#drawer'))$('#drawer').classList.remove('on')};$('#x-close').onclick=()=>$('#xpanel').classList.remove('on');$('#xpanel').onclick=e=>{if(e.target===$('#xpanel'))$('#xpanel').classList.remove('on')};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')setPage(current-1);if(e.key==='ArrowRight')setPage(current+1);if(e.key==='Escape'){$('#drawer').classList.remove('on');$('#xpanel').classList.remove('on')}});buildToc();render();
</script>
