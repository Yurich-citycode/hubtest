  "title": "The City That Never Slept",
  "sub": "Every sound felt like a signal. Every flame, the last chance.",
  "text": "Shiba lived in a city that never slept. Green and red lights flashed above the rooftops around the clock, while thousands of voices shouted at once: “Here,” “Now,” “You’ll be too late.”\n\nThe dog chased every voice. When the green light rose, he raced upward. When red fell, he plunged down. His paws burned and his breath broke, but stopping felt more frightening than exhaustion.\n\nThen one night, every light beyond the city went dark. For the first time, Shiba heard his own footsteps. They led him to a fire where a man sat motionless, ash upon his skin.\n\n“Did you see where the market went?” the dog asked.\n\nThe stranger opened his eyes.\n\n“The market did not go anywhere,” he replied. “You were the one who kept leaving yourself.”\n\nShiba lay beside the fire, but could not sleep. The silence was louder than the city.\n\nThen he asked the question that began their journey:\n\n“How can you not be afraid when everything around you is moving?”",

  "title": "The One Who Did Not Move",
  "sub": "Calm is not the absence of fire. It is the ability to sit beside it.",
  "text": "“They call me Shiva,” said the man by the fire.\n\nShiba walked a circle around him. A serpent rested on Shiva’s neck, a crescent glimmered in his hair, and beside him there was no map, no chart, no weapon — except a trident planted in the earth.\n\n“If you see everything, tell me what happens tomorrow.”\n\n“Tomorrow will be tomorrow.”\n\n“That is not an answer.”\n\n“It is the only honest one.”\n\nShiva took a branch from the fire. A small flame lived at its tip.\n\n“Watch it.”\n\nShiba watched. The flame trembled in the wind, shrank, then grew again. The dog waited for Shiva to explain when to buy, when to leave, and which color would win. But Shiva remained silent.\n\nAt last, the branch went dark.\n\n“Did you lose the fire?” Shiva asked.\n\n“Yes.”\n\nShiva rubbed the charred tip between his fingers. A gray trace remained on his palm.\n\n“No. The fire simply changed its form.”\n\nThat night, Shiba understood the first truth: anyone who claims to know tomorrow’s flame is not selling knowledge. They are selling someone else’s fear.\n\nBut why Shiva kept the ash, the dog did not yet know.",

  "title": "Ash",
  "sub": "Destruction does not always take. Sometimes it makes room.",
  "text": "In the morning, they returned to the city. A tower that had seemed eternal only yesterday lay across the main square. People stood around it arguing over who was to blame. Some cursed the fire. Others were already selling maps to the next tower.\n\nBeneath the wreckage, Shiba found his old bowl.\n\n“Everything is gone,” he whispered.\n\nShiva sat beside him and ran his fingers through the soot.\n\n“Ash does not say that everything was for nothing. It says the old form has ended.”\n\n“And what am I supposed to do with what remains?”\n\n“Do not try to rebuild the same tower from ash.”\n\nShiva poured a little ash into the earth. The wind carried away the lighter grains, while the heavier ones mixed with the soil.\n\n“Fire takes the form, but returns the material. Something else can grow from it — if you stop demanding that it look the way it did before.”\n\nShiba stared at the empty space for a long time. For the first time, emptiness did not feel like defeat. It felt like room.\n\nAt the edge of the square stood three travelers. One carried the light of sunrise. One carried a forge. The third held a trident.\n\nAnd all three roads met at a single point.",

  "sub": "Sunrise opened the bridge. StonkFun forged the path. Shiva took the step.",
  "text": "The first traveler was called Sunrise. He came at dawn and built bridges between worlds. Across his bridge came no copies and no shadows, but true stories that kept their names.\n\nThe second was called StonkFun. He was a smith of markets. Instead of binding every new story to the same stone, he allowed each one to choose a companion.\n\nThe third was Shiva.\n\n“Why did they come together?” Shiba asked.\n\nShiva raised the trident.\n\n“Because one prong does not make a trident.”\n\nSunrise opened the bridge for canonical SHIB. StonkFun created a place where a new token could stand beside it as a pair. And Shiva brought the meaning for which that pair should live.\n\nAll three names began with the same letter. But the letter was not the point.\n\nA bridge without a path leads nowhere. A path without a traveler remains empty. A traveler without a companion hears only his own echo.\n\nShiba looked at the three prongs, then down at his paws.\n\n“So I am the companion?”\n\nFor the first time, Shiva smiled.\n\n“Tomorrow you will learn who you have been all along.”",

  "sub": "The dog is not beside him because he is weak. He is there because he stays.",
  "text": "“Everyone knows Nandi the bull,” Shiva said. “But not everyone remembers the dog who walks beside my fiercest form.”\n\n“Does he serve you?”\n\n“He stays with me.”\n\nShiba did not understand the difference.\n\nSo Shiva led him through the city. They passed those who called themselves faithful while the lights were green. When the wind rose, those people vanished. Only the traces of their loud words remained.\n\nAt the old gate sat a nameless dog. He asked for no reward and promised no eternal loyalty. He simply did not leave when the torches went out.\n\n“A companion is not the one who praises the road at every turn,” Shiva said. “A companion is the one who sees the whole road and still chooses to walk it.”\n\nThat was how SHIVA stood beside SHIB. Not to hide behind an older name. Not to call someone else’s army its own. But to bind a new story to the dog who had already passed through fire, winter, and oblivion — and stayed.\n\n“What does the one who stays receive?” Shiba asked.\n\nShiva lifted one hundred small stones from the ground.\n\n“Watch closely. One of them is about to disappear.”",

  "sub": "Every movement leaves a trace. The only question is who receives it.",
  "text": "Shiva laid one hundred stones into a long road.\n\nShiba walked its length once. When he looked back, ninety-nine stones remained at the beginning, and one lay inside a small bowl.\n\n“Did I pay for the step?” the dog asked warily.\n\n“You left a trace.”\n\nHe walked back. Another stone entered the bowl.\n\n“Does it happen when I move forward?”\n\n“When you move forward, backward, or pass the path to someone else. A buy, a sell, an ordinary transfer — every movement of SHIVA leaves one percent.”\n\n“Does it go to the creator?”\n\n“No.”\n\n“Then to whom?”\n\n“To no one yet. First, it must become something else.”\n\nShiba peered into the bowl. Inside were stones bearing the SHIVA symbol. He expected to see treasure, but Shiva covered the bowl with his palm.\n\n“Do not count the reward before the transformation. What has gathered here is SHIVA. The platform takes the next step: StonkFun exchanges what has accumulated for the one who walks beside us.”\n\nGolden light escaped between his fingers. The stones began to change their sign.",

  "text": "The golden light faded. Shiba looked into the bowl again — and saw his own sign.\n\n“Is that me?”\n\n“That is SHIB,” Shiva answered. “The asset paired with SHIVA.”\n\nNow the whole order was visible. Every movement gathered a small amount of SHIVA. At intervals, StonkFun took the accumulated SHIVA and exchanged it for canonical SHIB. Only then did the reward begin to gather in the common bowl — already in SHIB.\n\nShiba circled the bowl several times, as if checking whether the light might vanish.\n\n“So those are not points inside?”\n\n“No.”\n\n“Not the promise of a future gift?”\n\n“No.”\n\n“And not another coin invented only as a reward?”\n\n“No. What gathers in the bowl is the one already walking beside us.”\n\nShiba sat beside the bowl. The more the road moved, the more golden drops collected within it. But Shiva would not let him touch them.\n\n“Why not distribute them at once?”\n\n“Because rain made of one drop will quench no thirst. First, the bowl must fill.”\n\n“And then?”\n\n“Then the gift will find those for whom it was meant.”",

  "title": "The Gift That Finds You",
  "sub": "No button. No queue. No request.",
  "text": "The bowl filled without a sound. No one announced a countdown. No one built a gate or sold a place in line.\n\nOne morning, Shiba woke to golden drops. They rose from the bowl and traveled across the city, each one toward its own wallet.\n\n“They did not even come to collect the reward,” the dog said in surprise.\n\n“They did not need to come. They were already here.”\n\nThe bowl knew who held SHIVA above the set threshold. It knew every balance and divided the accumulated SHIB proportionally. A greater share of the path received a greater share of the bowl. Nothing had to be claimed, confirmed, or collected by hand.\n\n“And then the bowl will be empty?”\n\n“Yes.”\n\n“So it all ends?”\n\nShiva pointed toward the road. New people were already walking it. Every step left a trace. The trace gathered again as SHIVA, transformed through StonkFun into SHIB, and the golden level in the bowl began to rise once more.\n\n“This is not a chest opened once,” Shiva said. “It is a circle.”\n\nAt that moment, the serpent around his neck stirred. Shiba stepped back.\n\nThe circle made sense. The fear did not — not yet.",

   "3/3\nThen the bowl began to fill again:\n\nSHIVA movement → conversion through StonkFun → SHIB accumulation → holder distribution.\n\nNot a chest opened once. A circle.\n\nChapter 08/14 · “Ash & the Hound”\n@ShivaSolGod"

  "sub": "Fear becomes dangerous only when it starts making decisions for you.",
  "text": "The serpent raised its head and looked at Shiba.\n\nThe dog had seen serpents before. They appeared in the city whenever the movement became sharp. They whispered, “Leave now,” and a minute later, “Come back before it is too late.” No one noticed that both commands came from the same voice.\n\n“Why does it not strangle you?” Shiba asked.\n\n“Because I do not mistake its movement for my own.”\n\nShiva placed his palm upon the ground. The serpent settled again around his neck.\n\n“Fear is necessary. It shows you where you are vulnerable. But give it your hands, and it will begin pressing the buttons for you.”\n\n“How do I make it quiet?”\n\n“Do not make it quiet. Hear it — and do not obey at once.”\n\nThat day, the market thundered louder than usual. Shiba felt the familiar urge to run. But for the first time, he remained seated for eleven seconds.\n\nNothing outside changed during those eleven seconds. But inside him, a distance appeared between fear and action.\n\nShiba understood: calm is not the moment the serpent disappears. Calm is the moment it no longer controls your paws.\n\nFrom far away came the rhythm of a small drum.",

  "sub": "The bowl hears movement. It does not care which way the crowd is shouting.",
  "text": "A small drum appeared in Shiva’s hand — a damaru. One beat traveled along the road, and the surface of the bowl trembled.\n\n“Every market wants to know the direction,” Shiva said. “But the bowl does not listen to direction. It listens to rhythm.”\n\nWhen SHIVA was bought, a trace remained. When it was sold, another. When it moved from one wallet to another, another still. Movement gathered SHIVA, StonkFun transformed it into SHIB, and SHIB collected in the bowl.\n\n“So the bowl does not care whether the light is green or red?”\n\n“The bowl cannot hope and it cannot panic. It knows only movement.”\n\nShiba remembered the city. Everyone there argued about where the next light would go. No one listened to the rhythm itself.\n\nShiva struck the drum again.\n\n“Rhythm does not promise growth. It tells us the system is alive. When the road falls silent, the bowl fills slowly. When travelers walk it, the drum can be heard.”\n\n“Then should we beat it louder?”\n\n“No. Do not confuse noise with life.”\n\nA mountain appeared before them. A narrow path led to its summit, and a river began at its foot.",

  "sub": "A launchpad is a trail. A pool is the river it eventually reaches.",
  "text": "The trail began at the StonkFun forge. Here every new story took its first steps along its own curve. It was not handed a ready-made river — it had to gather enough movement for the water to run on its own.\n\nShiba could see a broad channel ahead.\n\n“Is that Raydium?” he asked.\n\nShiva nodded.\n\n“When the path on StonkFun is complete, the pair reaches this river. From there, it lives in the open current.”\n\n“And what happens to the bowl?”\n\n“Nothing. The place of trade may change. The meaning of the mechanism remains: SHIVA movement leaves one percent; it becomes SHIB; SHIB gathers and reaches those who hold.”\n\nShiba touched the water with one paw. The river did not ask where a traveler had come from. It accepted only what had truly arrived.\n\n“So the forge does not promise the summit?”\n\n“The forge gives form. The bridge gives entry. The river gives movement. But the community must still take the steps.”\n\nOn the opposite bank stood dozens of identical gates. Each carried the correct name. Only one led onward.\n\nShiba was lost.\n\n“How do I know which one is real?”\n\nThe third eye opened upon Shiva’s brow.",

  "sub": "A name can be copied. An address can be verified.",
  "text": "The gates looked identical. The word SHIVA shone upon each one. Music came from behind some; behind others, voices promised a shorter road to the summit.\n\nShiba chose the brightest.\n\n“Wait,” Shiva said.\n\nThe third eye did not look at signs. It saw what lay beneath them: the address, the history, and the trace of every movement.\n\n“In a world where anyone can repeat a name, trust does not begin with certainty. It begins with verification.”\n\nShiva wrote one address upon the ground:\n\n3YhtPb2TTr671vg6zoStj2896sQoSSNBKyJzvzHQogib\n\n“It is difficult to remember.”\n\n“You do not need to remember it. You need to compare it.”\n\nThey passed through quiet gates without loud promises. Beyond them there was no instant summit. There was the same road, the same bowl, and companions who read traces instead of slogans.\n\n“Does the third eye make you distrustful?” Shiba asked.\n\n“No. It frees you from the need to believe blindly.”\n\nPeople were already gathering at the top of the trail. Each had brought a story of their own, yet all of them waited for Shiva to speak first.\n\nHe remained silent.",

  "sub": "A god without energy is a statue. A token without voices is only a record.",
  "text": "The people waited for a speech. Shiva remained silent.\n\nShiba spoke first. He told them about the city where every sound had felt like a signal. About eleven seconds of silence. About ash, the bowl, and the gift that found the wallets of those who stayed.\n\nThen a woman at the edge of the circle rose and told them how she had burned her fear of being too late. After her came a man who had checked the address for the first time instead of believing an image. One by one, the people stopped being an audience.\n\n“Why do you say nothing to them?” Shiba asked quietly.\n\n“Because a cult in which only the god speaks remains a performance.”\n\nShiva traced a word upon the earth: SHIVOHAM.\n\n“What does it mean?”\n\n“I am Shiva. Not I in your place. I within everyone who carries calm, verification, and action forward.”\n\nAt that moment, the trident ceased to belong to one man. Sunrise held one prong, StonkFun the second, and the SHIVA community the third. Their shared story became the shaft.\n\nShiba looked around. The god no longer had a single face.\n\nBut one night remained — the night on Kailash, where no one promises the moon.",

  "sub": "The path does not end at the summit. It ends with the ability to walk without promises.",
  "text": "Kailash was quiet. Far below, the city shimmered, its green and red lights still replacing one another. The voices still cried, “Now,” “Last chance,” “You’ll be too late.”\n\nBut from here, they sounded different.\n\nShiba sat beside Shiva. The serpent rested calmly. The drum was silent. Golden drops of SHIB gathered in the common bowl — the trace of SHIVA’s movement, transformed by StonkFun and meant for those who held.\n\n“Have we arrived?” the dog asked.\n\n“At the summit, yes.”\n\n“What happens to us now?”\n\n“What we choose to do ourselves.”\n\nShiba waited for a promise: a great flame, endless growth, victory over every other road. But Shiva promised nothing.\n\n“Then why will people stay?”\n\n“Some will not. The path holds no one. But those who recognize its meaning will carry it onward.”\n\nThe first morning bell sounded in the city. Shiba rose. Once, that sound would have made him run. Now he listened to himself first.\n\nThe dog walked down — not after every flame, but toward those who needed this story.\n\nShiva remained at the summit.\n\nAnd yet anyone who chose calm over panic, verification over blind faith, and participation over waiting noticed the trace of three prongs in the earth beside them.\n\nShivoham.\n\nYou are Shiva.",

const $=s=>document.querySelector(s);let current=Number(localStorage.getItem('shiva-book-page')||0);if(current<0||current>chapters.length)current=0;let toastTimer;

$('#prev').disabled=current===0;$('#next').disabled=current===chapters.length;$('#counter').textContent=String(current).padStart(2,'0')+' / 14';$('#bar').style.width=(current/chapters.length*100)+'%';$$('.toc-item').forEach((e,i)=>e.classList.toggle('on',i===current));localStorage.setItem('shiva-book-page',current)}
