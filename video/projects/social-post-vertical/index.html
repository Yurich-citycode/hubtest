<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Заголовок (можно с | для второй строки)","default":"НЕ ТОКЕН"},
    {"id":"subtitle","type":"string","label":"Подзаголовок золотом","default":"СБОРКА ВЫПУСКА ЦФА ДО ПЛОЩАДКИ"},
    {"id":"body","type":"string","label":"Одно предложение","default":"Инвестор покупает не бизнес. Он покупает право получить деньги."},
    {"id":"source","type":"string","label":"Источник справа сверху","default":"YURICHHUB // ЦФА"},
    {"id":"date","type":"string","label":"Дата","default":"10.2026"},
    {"id":"rubric","type":"string","label":"Рубрика слева внизу","default":"СБОРКА ВЫПУСКА // НЕ ОПЕРАТОР"},
    {"id":"series","type":"string","label":"Имя серии справа внизу (лайм)","default":"ЦФА"},
    {"id":"stat1v","type":"string","label":"Цифра 1","default":"80 000"},
    {"id":"stat1l","type":"string","label":"Подпись 1","default":"РАЗБОР, РУБ."},
    {"id":"stat1c","type":"color","label":"Цвет 1","default":"#E8377E"},
    {"id":"stat2v","type":"string","label":"Цифра 2","default":"0"},
    {"id":"stat2l","type":"string","label":"Подпись 2","default":"ДЕНЕГ НА МОЙ СЧЁТ"},
    {"id":"stat2c","type":"color","label":"Цвет 2","default":"#D7FF3D"},
    {"id":"stat3v","type":"string","label":"Цифра 3 (пусто — карточки нет)","default":"259-ФЗ"},
    {"id":"stat3l","type":"string","label":"Подпись 3","default":"ЗАПИСЬ У ОПЕРАТОРА ЦБ"},
    {"id":"stat3c","type":"color","label":"Цвет 3","default":"#C8A24A"}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <title>YurichHub — вертикальный пост</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Локальные шрифты: канон — Oswald 700 для русского дисплея, Inter для текста,
         Archivo для латиницы. См. brand/YURICHHUB-STYLE.md, раздел 4. */
      @font-face { font-family: 'Oswald'; src: url('assets/fonts/oswald-700.ttf') format('truetype'); font-weight: 700; font-display: block; }
      @font-face { font-family: 'Inter'; src: url('assets/fonts/inter-400.ttf') format('truetype'); font-weight: 400; font-display: block; }
      @font-face { font-family: 'Inter'; src: url('assets/fonts/inter-600.ttf') format('truetype'); font-weight: 600; font-display: block; }
      @font-face { font-family: 'Inter'; src: url('assets/fonts/inter-700.ttf') format('truetype'); font-weight: 700; font-display: block; }
      @font-face { font-family: 'Archivo'; src: url('assets/fonts/archivo-400.ttf') format('truetype'); font-weight: 400; font-display: block; }
      @font-face { font-family: 'Archivo'; src: url('assets/fonts/archivo-600.ttf') format('truetype'); font-weight: 600; font-display: block; }
      @font-face { font-family: 'Archivo'; src: url('assets/fonts/archivo-700.ttf') format('truetype'); font-weight: 700; font-display: block; }

      :root {
        --bg: #0a0a0a;
        --ink: #f3f1ea;
        --body: #c4c4c4;
        --dim: #8c8c8c;
        --lime: #d7ff3d;
        --gold: #c8a24a;
        --pink: #e8377e;
        --line: rgba(243, 241, 234, 0.14);
        --card: #101010;
      }

      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); }
      body { overflow: hidden; }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
      }
      .clip { position: absolute; inset: 0; }

      .stage { position: absolute; inset: 0; pointer-events: none; transform-origin: 50% 50%; }
      .glow { position: absolute; inset: 0; width: 100%; height: 100%; }
      .grain {
        position: absolute; inset: 0; opacity: 0.07; background-size: 320px 320px;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      .wipe { position: absolute; inset: 0; background: var(--lime); z-index: 40; }

      .source {
        position: absolute; right: 84px; top: 132px;
        font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 17px;
        letter-spacing: 2.4px; text-transform: uppercase; color: var(--dim); z-index: 20;
      }

      .mask { overflow: hidden; padding: 30px 34px 46px; margin: -30px -34px -46px; }
      .mask-inner { display: block; }
      .glitch-wrap { position: relative; display: block; }
      .glitch-wrap .glitch { position: absolute; left: 0; top: 0; display: block; }
      .glitch-wrap .g-pink, .glitch-wrap .g-pink i { color: var(--pink); opacity: 0.7; -webkit-text-stroke: 0; }
      .glitch-wrap .g-lime, .glitch-wrap .g-lime i { color: var(--lime); opacity: 0.5; -webkit-text-stroke: 0; }
      .glitch-wrap .base { position: relative; display: block; }
      .glitch-wrap i { font-style: normal; }

      .display {
        margin: 0; font-family: 'Oswald', sans-serif; font-weight: 700;
        text-transform: uppercase; line-height: 1.05; white-space: nowrap;
      }
      .t-title { font-size: 176px; letter-spacing: 1px; }
      .t-title2 { font-size: 176px; letter-spacing: 1px; color: var(--lime); -webkit-text-stroke: 4.9px currentColor; }
      .stroke-ink { -webkit-text-stroke: 4.9px currentColor; }
      .t-sub {
        font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 46px; line-height: 1.15;
        letter-spacing: 1.4px; text-transform: uppercase; color: var(--gold);
        -webkit-text-stroke: 1.3px currentColor;
      }

      /* Заголовок и подзаголовок живут в одном потоке: подстановка может дать
         вторую строку, и тогда подзаголовок обязан уехать вниз, а не наложиться. */
      #title-group { position: absolute; left: 84px; top: 372px; width: 912px; }
      #subtitle-block { margin-top: 34px; }

      .cards { position: absolute; left: 84px; top: 850px; width: 912px; display: grid; gap: 24px; }
      .card {
        position: relative; height: 168px; background: var(--card);
        border: 1.5px solid var(--line); border-radius: 0; padding-left: 30px; box-sizing: border-box;
      }
      .card .plate { position: absolute; left: 0; top: 0; width: 6px; height: 100%; background: var(--accent); }
      .card { box-shadow: 6px 6px 0 var(--accent); }
      .card .val {
        display: block; margin-top: 38px; font-family: 'Oswald', sans-serif; font-weight: 700;
        font-size: 64px; line-height: 1; color: var(--ink); letter-spacing: 1px;
      }
      .card .lab {
        display: block; margin-top: 20px; font-family: 'Inter', sans-serif; font-weight: 700;
        font-size: 15px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--dim);
      }

      #body-block {
        position: absolute; left: 84px; top: 1520px; width: 900px;
        font-family: 'Inter', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.5; color: var(--body);
      }

      #footer-rule { position: absolute; left: 84px; top: 1730px; width: 912px; height: 2px; background: var(--line); }
      #footer-brand {
        position: absolute; left: 84px; top: 1778px; font-family: 'Oswald', sans-serif; font-weight: 700;
        font-size: 30px; letter-spacing: 1.2px; color: var(--ink); -webkit-text-stroke: 0.84px currentColor;
      }
      #footer-brand .hub { color: var(--lime); -webkit-text-stroke: 0.84px var(--lime); }
      #footer-rubric {
        position: absolute; left: 84px; top: 1832px; font-family: 'Inter', sans-serif; font-weight: 600;
        font-size: 15px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--dim);
      }
      #footer-date {
        position: absolute; right: 84px; top: 1780px; font-family: 'Archivo', sans-serif; font-weight: 400;
        font-size: 24px; letter-spacing: 2px; color: var(--dim);
      }
      #footer-series {
        position: absolute; right: 84px; top: 1826px; font-family: 'Oswald', sans-serif; font-weight: 700;
        font-size: 28px; letter-spacing: 1.2px; color: var(--lime); -webkit-text-stroke: 0.78px currentColor;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="social-post-vertical"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="8"
      data-fps="30"
    >
      <div class="stage" aria-hidden="true">
        <svg class="glow" viewBox="0 0 1080 1920" preserveAspectRatio="none">
          <ellipse cx="162" cy="170" rx="480" ry="700" fill="#D7FF3D" opacity="0.05" />
          <ellipse cx="958" cy="1834" rx="500" ry="720" fill="#C8A24A" opacity="0.05" />
        </svg>
        <div class="grain"></div>
      </div>

      <div class="source" id="src" data-var-text="source">YURICHHUB // ЦФА</div>

      <div id="title-group">
        <div id="title-block">
        <span class="mask" data-layout-allow-overflow>
          <span class="mask-inner" id="title-inner">
            <span class="glitch-wrap">
              <span class="glitch g-pink" id="t-glitch-pink" aria-hidden="true"><i class="display t-title" data-layout-allow-overlap>НЕ ТОКЕН</i></span>
              <span class="glitch g-lime" id="t-glitch-lime" aria-hidden="true"><i class="display t-title" data-layout-allow-overlap>НЕ ТОКЕН</i></span>
              <span class="base display t-title stroke-ink" id="title-line1"><i data-layout-allow-overlap>НЕ ТОКЕН</i></span>
            </span>
          </span>
        </span>
        </div>

        <div id="subtitle-block">
          <span class="mask"><span class="mask-inner t-sub" id="subtitle" data-var-text="subtitle">СБОРКА ВЫПУСКА ЦФА ДО ПЛОЩАДКИ</span></span>
        </div>
      </div>

      <div class="cards">
        <div class="card" id="card-1" style="--accent: var(--stat1c, #E8377E)">
          <span class="plate" id="card-1-plate"></span>
          <span class="val" data-var-text="stat1v">80 000</span>
          <span class="lab" data-var-text="stat1l">РАЗБОР, РУБ.</span>
        </div>
        <div class="card" id="card-2" style="--accent: var(--stat2c, #D7FF3D)">
          <span class="plate" id="card-2-plate"></span>
          <span class="val" data-var-text="stat2v">0</span>
          <span class="lab" data-var-text="stat2l">ДЕНЕГ НА МОЙ СЧЁТ</span>
        </div>
        <div class="card" id="card-3" style="--accent: var(--stat3c, #C8A24A)">
          <span class="plate" id="card-3-plate"></span>
          <span class="val" data-var-text="stat3v">259-ФЗ</span>
          <span class="lab" data-var-text="stat3l">ЗАПИСЬ У ОПЕРАТОРА ЦБ</span>
        </div>
      </div>

      <div id="body-block" data-var-text="body">
        Инвестор покупает не бизнес. Он покупает право получить деньги.
      </div>

      <div id="footer-rule"></div>
      <div id="footer-brand">YURICH<span class="hub">HUB</span></div>
      <div id="footer-rubric" data-var-text="rubric">СБОРКА ВЫПУСКА // НЕ ОПЕРАТОР</div>
      <div id="footer-date" data-var-text="date">10.2026</div>
      <div id="footer-series" data-var-text="series">ЦФА</div>

      <div class="wipe" id="wipe"></div>
    </div>

    <script>
      (function () {
        var vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};

        // ---- подстановка заголовка: "|" даёт вторую строку лаймом ----
        var rawTitle = vars.title || 'НЕ ТОКЕН';
        var parts = String(rawTitle).split('|');
        var line1 = parts[0].trim();
        var line2 = parts.length > 1 ? parts[1].trim() : '';

        var line1El = document.querySelector('#title-line1 i');
        var glitchEls = [document.getElementById('t-glitch-pink').querySelector('i'), document.getElementById('t-glitch-lime').querySelector('i')];
        line1El.textContent = line1;
        glitchEls.forEach(function (el) { el.textContent = line1; });

        // Подбор кегля по длине: канон требует держать заголовок в 2–4 словах,
        // но подстановка приходит откуда угодно, поэтому подстраховываемся.
        var n = line1.length;
        var baseSize = line2 ? (n <= 8 ? 150 : n <= 12 ? 128 : 110) : n <= 8 ? 200 : n <= 11 ? 170 : n <= 14 ? 146 : 124;
        var COL = 912; // ширина колонки заголовка, см. #title-group

        // Кегль подбираем по фактической ширине: длинный заголовок ужимается,
        // а не вылезает за поле 84px справа.
        function fit(el, start) {
          var size = start;
          el.style.fontSize = size + 'px';
          for (var i = 0; i < 24; i += 1) {
            if (el.getBoundingClientRect().width <= COL) break;
            size *= 0.96;
            el.style.fontSize = size + 'px';
          }
          el.style.webkitTextStroke = Math.max(1, size * 0.028).toFixed(1) + 'px currentColor';
          return size;
        }

        document.querySelectorAll('#title-block .display').forEach(function (el) {
          fit(el, baseSize);
        });

        if (line2) {
          var wrap = document.createElement('span');
          wrap.className = 'glitch-wrap';
          wrap.style.marginTop = '10px';
          wrap.innerHTML = '<span class="base display t-title2" style="display:block"><i data-layout-allow-overlap>' + line2.replace(/[<>&]/g, '') + '</i></span>';
          document.getElementById('title-inner').appendChild(wrap);
          wrap.querySelectorAll('.display').forEach(function (el) { fit(el, baseSize); });
        }

        // ---- карточки без значения не показываем и убираем из сетки ----
        ['1', '2', '3'].forEach(function (i) {
          var value = vars['stat' + i + 'v'];
          var card = document.getElementById('card-' + i);
          var empty = value !== undefined && String(value).trim() === '';
          card.style.display = empty ? 'none' : 'block';
          if (!empty) {
            card.querySelector('.val').textContent = value !== undefined ? value : card.querySelector('.val').textContent;
          }
        });

        // Подзаголовок в одну строку капсом: если не влезает, ужимаем кегль.
        var subEl = document.getElementById('subtitle');
        if (subEl.getBoundingClientRect().width > 912) {
          var ss = 46;
          subEl.style.whiteSpace = 'nowrap';
          while (ss > 24 && subEl.getBoundingClientRect().width > 912) {
            ss -= 2;
            subEl.style.fontSize = ss + 'px';
          }
        }

        var ready = document.fonts ? document.fonts.ready : Promise.resolve();

        ready.then(function () {
          var tl = gsap.timeline({ paused: true, defaults: { ease: 'power4.out' } });

          var cards = Array.prototype.slice.call(document.querySelectorAll('.card')).filter(function (c) {
            return c.style.display !== 'none';
          });
          var cardIds = cards.map(function (c) { return '#' + c.id; });

          gsap.set('#wipe', { scaleX: 1, transformOrigin: 'right center' });
          gsap.set('#src', { opacity: 0, y: -12 });
          gsap.set('#title-inner', { y: 170, opacity: 0 });
          gsap.set('#subtitle', { y: 30, opacity: 0 });
          gsap.set(cardIds, { x: 56, opacity: 0 });
          gsap.set(cardIds.map(function (id) { return id + '-plate'; }), { scaleY: 0, transformOrigin: 'top center' });
          gsap.set(cardIds.map(function (id) { return id + ' .val'; }), { y: 26, opacity: 0 });
          gsap.set('#body-block', { y: 22, opacity: 0 });
          gsap.set('#footer-rule', { scaleX: 0, transformOrigin: 'left center' });
          gsap.set(['#footer-brand', '#footer-rubric', '#footer-date', '#footer-series'], { y: 16, opacity: 0 });
          gsap.set('.stage', { scale: 1 });

          // Медленный дрейф фона: держит кадр живым, не ломая постер.
          tl.to('.stage', { scale: 1.045, duration: 8, ease: 'none' }, 0);

          tl.to('#wipe', { scaleX: 0, duration: 0.34, ease: 'power3.inOut' }, 0.04)
            .to('#src', { opacity: 1, y: 0, duration: 0.45 }, 0.34)
            .to('#title-inner', { y: 0, opacity: 1, duration: 0.62 }, 0.42)

            .fromTo('#t-glitch-pink', { x: 32, y: 24 }, { x: 6, y: 5, duration: 0.22, ease: 'steps(4)' }, 0.46)
            .fromTo('#t-glitch-lime', { x: -28, y: -20 }, { x: -6, y: -4, duration: 0.22, ease: 'steps(4)' }, 0.46)
            .to('#subtitle', { y: 0, opacity: 1, duration: 0.5 }, 0.78);

          cards.forEach(function (card, i) {
            var t = 1.12 + i * 0.12;
            tl.to('#' + card.id, { x: 0, opacity: 1, duration: 0.44 }, t)
              .to('#' + card.id + '-plate', { scaleY: 1, duration: 0.3, ease: 'power3.out' }, t + 0.05)
              .to('#' + card.id + ' .val', { y: 0, opacity: 1, duration: 0.4, ease: 'back.out(1.6)' }, t + 0.09);
          });

          tl.to('#body-block', { y: 0, opacity: 1, duration: 0.5 }, 1.7)
            .to('#footer-rule', { scaleX: 1, duration: 0.55, ease: 'power3.inOut' }, 1.9)
            .to('#footer-brand', { y: 0, opacity: 1, duration: 0.45 }, 2.08)
            .to('#footer-rubric', { y: 0, opacity: 1, duration: 0.45 }, 2.16)
            .to('#footer-date', { y: 0, opacity: 1, duration: 0.45 }, 2.24)
            .to('#footer-series', { y: 0, opacity: 1, duration: 0.45 }, 2.32);

          window.__timelines['social-post-vertical'] = tl;
        });
      })();
    </script>
  </body>
</html>
